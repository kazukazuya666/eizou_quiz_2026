<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>映像班問題</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <h1>映像問題</h1>

  <!-- 解答画面 -->
  <div id="quiz-screen">
    <div id="question-number" class="q-number"></div>
    <h2 id="question-text" class="q-text"></h2>
    
    <!-- ○×問題用 -->
    <div id="ox-container" class="ox-container hidden">
      <button class="btn-ox btn-o" onclick="answerOX(true)">○</button>
      <button class="btn-ox btn-x" onclick="answerOX(false)">×</button>
    </div>

    <!-- 4択問題用 -->
    <div id="choice-container" class="choice-container hidden">
      <div id="choice-list" class="choice-list"></div>
    </div>

    <!-- 並べ替え問題用（ドラッグ＆スライド対応） -->
    <div id="sort-container" class="sort-container hidden">
      <p class="sort-hint">スライドで並べ替え</p>
      <div id="sort-list" class="sort-list"></div>
      <button class="btn" style="margin-top: 20px; width: 100%;" onclick="answerSort()">決定</button>
    </div>

    <!-- 解説エリア -->
    <div id="feedback" class="explanation-box hidden">
      <div id="judge-result" class="judge"></div>
      <div id="explanation-text" class="exp-text"></div>
      <button class="btn" style="margin-top: 15px; width: 100%;" onclick="nextQuestion()">次の問題へ</button>
    </div>
  </div>

  <!-- 結果表示画面 -->
  <div id="result-screen" class="hidden">
    <div class="result-score" id="score-text"></div>
    <h3 class="review-title">解説</h3>
    <div id="review-list"></div>
    <button class="btn" style="width: 100%; margin-top: 25px;" onclick="restartQuiz()">もう1回</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
